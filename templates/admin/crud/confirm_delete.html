{% extends 'base.html' %}{% block title %}Confirm Delete{% endblock %}{% block content %}<div class="container" style="max-width:600px; margin:2rem auto; text-align:center;">    <h2>Confirm Delete</h2>    <p>Are you sure you want to delete this {{ type }}?</p>    <form method="post">        {% csrf_token %}        <button type="submit" style="padding:0.5rem 1rem; background:#ef4444; color:white; border:none; border-radius:4px;">Delete</button>        <a href="{% url 'admin_dashboard' %}" style="margin-left:0.5rem;">Cancel</a>    </form></div>{% endblock %}
