{% extends 'base.html' %}{% block title %}Appointment Form{% endblock %}{% block content %}<div class="container" style="max-width:700px; margin:2rem auto;">    <h2>{% if object %}Edit Appointment{% else %}Create Appointment{% endif %}</h2>    <form method="post">        {% csrf_token %}        {{ form.as_p }}        <div style="display:flex; gap:0.5rem;">            <button type="submit" style="padding:0.5rem 1rem;">Save</button>            <a href="{% url 'admin_dashboard' %}">Cancel</a>        </div>    </form></div>{% endblock %}
