{% extends 'base.html' %}{% load static %}{% block title %}Admin Login - Horse Electricals and Engineering Works{% endblock %}{% block content %}<section class="membership-intro">    <div class="container">        <h2>Admin Login</h2>        <p>Sign in with your admin credentials to access the dashboard.</p>    </div></section><section class="login-form">    <div class="container">        <div class="card" style="max-width:420px; margin:1rem auto; padding:1.5rem;">            <form method="post" action="{% url 'admin_login' %}">                {% csrf_token %}                <div style="margin-bottom:1rem;">                    <label for="username">Username</label><br>                    <input type="text" id="username" name="username" required style="width:100%; padding:0.5rem;">                </div>                <div style="margin-bottom:1rem;">                    <label for="password">Password</label><br>                    <input type="password" id="password" name="password" required style="width:100%; padding:0.5rem;">                </div>                <div style="display:flex; gap:0.5rem; align-items:center;">                    <button type="submit" style="padding:0.5rem 1rem;">Sign in</button>                    <a href="{% url 'home' %}" style="margin-left:0.5rem;">Cancel</a>                </div>            </form>        </div>    </div></section>{% endblock %}
